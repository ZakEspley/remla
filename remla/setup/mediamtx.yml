# REMLA uses MediaMTX as a low-latency RTSP-to-WebRTC router.
logLevel: info
logDestinations: [file]
logFile: mediamtx.log

# REMLA uses this local-only API for native Raspberry Pi camera controls.
api: true
apiAddress: 127.0.0.1:9997

# Keep RTSP available for local diagnostics.
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

# WHEP signaling is proxied by nginx. Media normally uses UDP, with TCP on
# the same port as a fallback for restrictive internet connections.
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# These protocols are not part of the REMLA camera path.
rtmp: false
hls: false
srt: false
playback: false
metrics: false
pprof: false
moq: false

paths:
  cam:
    source: rpiCamera
    rpiCameraWidth: 1920
    rpiCameraHeight: 1080
    rpiCameraFPS: 30
    rpiCameraBitrate: 5000000
    rpiCameraIDRPeriod: 10
    # Preserve existing WHEP readers if the native source briefly becomes
    # unavailable during a camera mux change.
    alwaysAvailable: true
    alwaysAvailableTracks:
      - codec: H264
