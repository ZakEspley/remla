# REMLA uses MediaMTX as a low-latency RTSP-to-WebRTC router.
logLevel: info
logDestinations: [file]
logFile: mediamtx.log

# REMLA polls this local-only API to signal when the live camera publisher has
# replaced the always-available offline segment.
api: true
apiAddress: 127.0.0.1:9997

# Keep the local Picamera2 publisher simple and deterministic.
rtsp: true
rtspAddress: 127.0.0.1:8554
rtspTransports: [tcp]

# WHEP signaling is proxied by nginx. Media normally uses UDP, with TCP on
# the same port as a fallback for restrictive internet connections.
webrtc: true
webrtcAddress: 127.0.0.1:8889
webrtcLocalUDPAddress: :8189
webrtcLocalTCPAddress: :8189
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# These protocols are not part of the REMLA camera path.
rtmp: false
hls: false
srt: false
playback: false
metrics: false
pprof: false
moq: false

paths:
  cam:
    source: publisher
    # Preserve existing WHEP readers while Picamera2 and its RTSP publisher
    # restart during a camera mux change.
    alwaysAvailable: true
    alwaysAvailableTracks:
      - codec: H264
