[project]
name = "remla"
version = "0.4.0.dev0"
description = "Remote control service for Raspberry Pi laboratory hardware"
authors = [{name = "Zak Espley", email = "zespley@gmail.com"}]
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12.1,<0.13",
    "click>=8.1.3,<8.2",
    "ruamel-yaml>=0.18.6,<0.19",
    "rpistepper>=0.3a1,<0.4",
    "pyvisa>=1.14.1,<2",
    "pyvisa-py>=0.7.2,<0.8",
    "adafruit-circuitpython-motorkit>=1.6.14,<2",
    "python-tplink-smarthome>=0.1.3,<0.2",
    "dlipower>=1.0.176,<2",
    "websockets>=12.0,<13",
    "validators>=0.28.3,<0.29",
    "pigpio>=1.78,<2",
    "wheel>=0.43.0,<1",
    "setuptools>=70.0.0,<71",
    "pathvalidate>=3.2.0,<4",
    "psutil>=5.9.4,<6",
    "requests>=2.31,<3",
]

[project.scripts]
remla = "remla.main:app"

[tool.hatch.build.targets.wheel]
packages = ["remla"]

[tool.hatch.build.targets.sdist]
include = [
    "/remla",
    "/packaging",
    "/scripts",
    "/tests",
    "/README.md",
    "/AGENTS.md",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
