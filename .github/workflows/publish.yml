name: Publish ReMLA release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.ref_name, '.dev')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4

      - name: Set up UV
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"

      - name: Verify locked dependencies
        run: uv sync --locked

      - name: Verify release version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$tag_version" = "$package_version"

      - name: Build release artifacts
        run: |
          uv build
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file dist/requirements.txt
          cp scripts/install.sh dist/install.sh
          cp packaging/remla.service dist/remla.service
          cp packaging/49-remla.rules dist/49-remla.rules
          (cd dist && sha256sum remla-*.whl requirements.txt remla.service 49-remla.rules > SHA256SUMS)

      - name: Run hardware-free tests
        run: >-
          uv run python -m unittest
          tests.test_runtime_imports
          tests.test_experiment_lifecycle
          tests.test_boot_status
          tests.test_camera_cycle
          tests.test_runtime_state
          tests.test_runtime_operations
          tests.test_command_scheduler
          tests.test_mediamtx
          tests.test_mediamtx_camera
          tests.test_device_config
          tests.test_controller_safety
          tests.test_installation
          tests.test_release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/remla-*.whl
            dist/remla-*.tar.gz
            dist/install.sh
            dist/requirements.txt
            dist/remla.service
            dist/49-remla.rules
            dist/SHA256SUMS
